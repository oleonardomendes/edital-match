name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: edital
          POSTGRES_PASSWORD: edital
          POSTGRES_DB: edital_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edital" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://edital:edital@localhost:5432/edital_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Testes (unitários, avaliação e API com Postgres + pgvector)
        run: pytest -v
      - name: Avaliação contra o gabarito
        run: python -m eval.run_eval
