services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: edital
      POSTGRES_PASSWORD: edital
      POSTGRES_DB: edital_match
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edital -d edital_match"]
      interval: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://edital:edital@db:5432/edital_match
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
